[auth]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[functions.signup-account]
verify_jwt = false

[functions.reconcile-achievements]
verify_jwt = false

[functions.register-push-subscription]
verify_jwt = false

# New publishable/secret API keys are not legacy JWT API keys. The platform
# verify_jwt gate is disabled and this function verifies the user's session JWT
# in code before checking row ownership/freshness.
[functions.notify-event]
verify_jwt = false

# Scheduled entry points authenticate with the domain-separated cron capability
# on x-cron-secret; they do not accept end-user sessions as scheduler authority.
[functions.dispatch-inactivity-reminders]
verify_jwt = false

[functions.dispatch-push-backstop]
verify_jwt = false

[functions.admin-status]
verify_jwt = false

[functions.broadcast-test-notification]
verify_jwt = false

[functions.admin-set-password]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# The service worker acknowledging a delivered notification. No end-user JWT is
# available inside a worker, so this authenticates on the unguessable per-delivery
# receipt id carried in the push payload instead.
[functions.ack-push]
verify_jwt = false

# Reads the delivery log for the debug menu. Admin allowlist enforced in-function.
[functions.push-delivery-report]
verify_jwt = false

[functions.admin-discord-settings]
verify_jwt = false

[functions.discord-test-notification]
verify_jwt = false
