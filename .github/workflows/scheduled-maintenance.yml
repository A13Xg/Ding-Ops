name: DING Scheduled Maintenance

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  VAPID_KEYS_JSON: ${{ secrets.VAPID_KEYS_JSON }}

jobs:
  push-backstop:
    name: Push backstop
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch unannounced DING events
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${VAPID_KEYS_JSON:-}" ]; then
            echo "::notice::DING scheduled dispatch is dormant until SUPABASE_PROJECT_REF and VAPID_KEYS_JSON exist."
            exit 0
          fi
          private_key="$(
            printf '%s' "$VAPID_KEYS_JSON" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                if (typeof value?.privateKey !== "string" || !value.privateKey) process.exit(1);
                process.stdout.write(value.privateKey);
              });
            '
          )"
          cron_secret="$(
            VAPID_PRIVATE_KEY="$private_key" node -e '
              const { createHash } = require("crypto");
              process.stdout.write(
                createHash("sha256")
                  .update("ding-cron-v1:" + process.env.VAPID_PRIVATE_KEY)
                  .digest("base64url")
              );
            '
          )"
          echo "::add-mask::$private_key"
          echo "::add-mask::$cron_secret"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 40 \
            -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/dispatch-push-backstop" \
            -H "x-cron-secret: $cron_secret" \
            -H "content-type: application/json" \
            -d '{}'

  inactivity:
    name: Inactivity reminders
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due inactivity reminders
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${VAPID_KEYS_JSON:-}" ]; then
            echo "::notice::DING inactivity dispatch is dormant until SUPABASE_PROJECT_REF and VAPID_KEYS_JSON exist."
            exit 0
          fi
          private_key="$(
            printf '%s' "$VAPID_KEYS_JSON" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                if (typeof value?.privateKey !== "string" || !value.privateKey) process.exit(1);
                process.stdout.write(value.privateKey);
              });
            '
          )"
          cron_secret="$(
            VAPID_PRIVATE_KEY="$private_key" node -e '
              const { createHash } = require("crypto");
              process.stdout.write(
                createHash("sha256")
                  .update("ding-cron-v1:" + process.env.VAPID_PRIVATE_KEY)
                  .digest("base64url")
              );
            '
          )"
          echo "::add-mask::$private_key"
          echo "::add-mask::$cron_secret"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 40 \
            -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/dispatch-inactivity-reminders" \
            -H "x-cron-secret: $cron_secret" \
            -H "content-type: application/json" \
            -d '{}'
