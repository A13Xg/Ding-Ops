name: DING source formatter

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/format-ding-social-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ding-source-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format all active DING source
        run: npx prettier --write "src/**/*.{js,jsx,css}"
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format DING source"
          git push origin HEAD:main
