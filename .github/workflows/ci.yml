name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ding_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ding_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck app
        run: npm run typecheck
      - name: Check live smoke script syntax
        run: node --check scripts/supabase-smoke.mjs

      - name: Execute DING migrations in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d ding_ci -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as 'select null::uuid';
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create publication supabase_realtime;
          SQL
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d ding_ci -v ON_ERROR_STOP=1 -f "$migration"
          done

      # The Edge Functions are Deno TypeScript and are invisible to eslint/tsc,
      # which target the browser app. Without these steps a type error, a bad
      # import, or a wrong table/column name in supabase/functions/ only ever
      # surfaces in production.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Functions
        run: npm run lint:functions

      - name: Typecheck Edge Functions
        run: npm run typecheck:functions
      - name: Test Edge Functions
        run: npm run test:functions

      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Test coverage
        run: npm run test:coverage
      - name: Build webpage
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify production bundle isolation
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "demo-alex"
            "Smoke Zone"
            "yuorggekucycvxrtqvvp"
            "bust4me"
            "bust-push"
            "bust-sw-version"
            "bust_haptics"
            "ding4me"
          )
          for token in "${forbidden[@]}"; do
            if grep -R --fixed-strings --quiet -- "$token" dist; then
              echo "::error::Forbidden development/legacy token leaked into production bundle: $token"
              exit 1
            fi
          done
