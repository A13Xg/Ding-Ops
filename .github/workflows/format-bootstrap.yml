name: One-shot DING formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format new DING source
        run: npx prettier --write src/DingApp.jsx src/dingShell.css src/dingDomain.js src/dingDomain.test.js src/dingPending.js src/dingPending.test.js src/dingMigrationContract.test.js src/gameConfig.js
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "style: format DING bootstrap source"
          git push
