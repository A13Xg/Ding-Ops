name: DING Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      DING_INVITE_CODE: ${{ secrets.DING_INVITE_CODE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify linked DING backend
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ] || [ -z "${DING_INVITE_CODE:-}" ]; then
            echo "::error::Add VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, and DING_INVITE_CODE GitHub secrets first."
            exit 1
          fi
          npm run test:integration
