name: DING Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DING_INVITE_CODE: ${{ secrets.DING_INVITE_CODE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Resolve DING public backend configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF DING_INVITE_CODE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]+$'; then
            echo "::error::SUPABASE_PROJECT_REF must contain only lowercase letters and digits."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "yuorggekucycvxrtqvvp" ]; then
            echo "::error::Refusing to smoke-test DING against the known Bust production Supabase project."
            exit 1
          fi
          if [ "${#DING_INVITE_CODE}" -lt 24 ]; then
            echo "::error::DING_INVITE_CODE must be at least 24 characters."
            exit 1
          fi

          keys_json="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json)"
          publishable="$(
            printf '%s' "$keys_json" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const keys = JSON.parse(raw);
                const key = Array.isArray(keys)
                  ? keys.find(item => item?.type === "publishable" && item?.name === "default" && item?.api_key)
                  : null;
                if (!key) {
                  console.error("Default Supabase publishable key was not found.");
                  process.exit(1);
                }
                process.stdout.write(key.api_key);
              });
            '
          )"
          echo "::add-mask::$publishable"
          echo "VITE_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable" >> "$GITHUB_ENV"

      - name: Verify linked DING backend
        run: npm run test:integration
