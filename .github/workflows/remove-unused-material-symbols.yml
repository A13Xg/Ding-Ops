name: Remove unused Material Symbols

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-unused-material-symbols.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ding-remove-material-symbols
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm uninstall material-symbols
      - name: Commit dependency cleanup
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remove unused Material Symbols dependency"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
