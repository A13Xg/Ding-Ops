name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy DING']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ding-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VAPID_KEYS_JSON: ${{ secrets.VAPID_KEYS_JSON }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Resolve production browser configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF VAPID_KEYS_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret for Pages deployment: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]+$'; then
            echo "::error::SUPABASE_PROJECT_REF must contain only lowercase letters and digits."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "yuorggekucycvxrtqvvp" ]; then
            echo "::error::Refusing to build DING Pages against the known Bust production Supabase project."
            exit 1
          fi

          vapid_public="$(
            printf '%s' "$VAPID_KEYS_JSON" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                if (typeof value?.publicKey !== "string" || !value.publicKey) {
                  console.error("VAPID_KEYS_JSON does not contain a publicKey.");
                  process.exit(1);
                }
                process.stdout.write(value.publicKey);
              });
            '
          )"

          keys_json="$(
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          )"
          publishable="$(
            printf '%s' "$keys_json" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const keys = JSON.parse(raw);
                const key = Array.isArray(keys)
                  ? keys.find(item => item?.type === "publishable" && item?.name === "ding-web" && item?.api_key)
                  : null;
                if (!key) {
                  console.error("Named ding-web publishable key was not found. Run Deploy DING first.");
                  process.exit(1);
                }
                process.stdout.write(key.api_key);
              });
            '
          )"

          echo "::add-mask::$publishable"
          echo "VITE_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable" >> "$GITHUB_ENV"
          echo "VITE_WEB_PUSH_PUBLIC_KEY=$vapid_public" >> "$GITHUB_ENV"

      - name: Build production site
        env:
          GHPAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Verify production bundle isolation
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "demo-alex"
            "Smoke Zone"
            "yuorggekucycvxrtqvvp"
            "bust4me"
            "bust-push"
            "bust-sw-version"
            "bust_haptics"
            "ding4me"
          )
          for token in "${forbidden[@]}"; do
            if grep -R --fixed-strings --quiet -- "$token" dist; then
              echo "::error::Forbidden development/legacy token leaked into production bundle: $token"
              exit 1
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
