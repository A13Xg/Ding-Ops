name: Deploy DING

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ding-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Supabase then Pages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ding_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ding_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
      DING_INVITE_CODE: ${{ secrets.DING_INVITE_CODE }}
      BROADCAST_ADMINS: ${{ secrets.BROADCAST_ADMINS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Preflight browser app
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          node --check scripts/supabase-smoke.mjs
          npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Preflight Edge Functions
        run: |
          npm run lint:functions
          npm run typecheck:functions
          npm run test:functions

      - name: Dry-run DING migrations in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ding_ci
        run: bash scripts/validate-migrations.sh

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY \
            VITE_WEB_PUSH_PUBLIC_KEY \
            VAPID_PUBLIC_KEY \
            VAPID_PRIVATE_KEY \
            VAPID_SUBJECT \
            REMINDER_CRON_SECRET \
            DING_INVITE_CODE
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          expected_url="https://${SUPABASE_PROJECT_REF}.supabase.co"
          if [ "${VITE_SUPABASE_URL%/}" != "$expected_url" ]; then
            echo "::error::VITE_SUPABASE_URL does not match SUPABASE_PROJECT_REF."
            exit 1
          fi

          if [ "$VITE_WEB_PUSH_PUBLIC_KEY" != "$VAPID_PUBLIC_KEY" ]; then
            echo "::error::VITE_WEB_PUSH_PUBLIC_KEY and VAPID_PUBLIC_KEY must be the same VAPID public key."
            exit 1
          fi

          if [ "${#REMINDER_CRON_SECRET}" -lt 32 ]; then
            echo "::error::REMINDER_CRON_SECRET must be at least 32 characters."
            exit 1
          fi

          if [ "${#DING_INVITE_CODE}" -lt 24 ]; then
            echo "::error::DING_INVITE_CODE must be at least 24 characters."
            exit 1
          fi

          case "$VAPID_SUBJECT" in
            mailto:*|https://*) ;;
            *)
              echo "::error::VAPID_SUBJECT must start with mailto: or https://"
              exit 1
              ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link dedicated DING Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply DING migrations
        run: supabase db push --linked --include-all

      - name: Configure Edge Function secrets
        shell: bash
        env:
          DING_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          args=(
            "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
            "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            "VAPID_SUBJECT=$VAPID_SUBJECT"
            "REMINDER_CRON_SECRET=$REMINDER_CRON_SECRET"
            "DING_INVITE_CODE=$DING_INVITE_CODE"
            "SITE_URL=$DING_SITE_URL"
          )
          if [ -n "${BROADCAST_ADMINS:-}" ]; then args+=("BROADCAST_ADMINS=$BROADCAST_ADMINS"); fi
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then args+=("DISCORD_WEBHOOK_URL=$DISCORD_WEBHOOK_URL"); fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"

      - name: Deploy DING Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Live Supabase integration smoke
        run: npm run test:integration

      - name: Build GitHub Pages artifact
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
