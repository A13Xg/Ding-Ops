name: Deploy DING

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ding-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Supabase then Pages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ding_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ding_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VAPID_KEYS_JSON: ${{ secrets.VAPID_KEYS_JSON }}
      VAPID_SUBJECT: https://github.com/${{ github.repository_owner }}
      DING_INVITE_CODE: ${{ secrets.DING_INVITE_CODE }}
      BROADCAST_ADMINS: ${{ secrets.BROADCAST_ADMINS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Preflight browser app
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          node --check scripts/supabase-smoke.mjs
          npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Preflight Edge Functions
        run: |
          npm run lint:functions
          npm run typecheck:functions
          npm run test:functions

      - name: Dry-run DING migrations in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ding_ci
        run: bash scripts/validate-migrations.sh

      - name: Validate and derive production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF \
            VAPID_KEYS_JSON \
            DING_INVITE_CODE
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z0-9]+$'; then
            echo "::error::SUPABASE_PROJECT_REF must contain only lowercase letters and digits."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "yuorggekucycvxrtqvvp" ]; then
            echo "::error::Refusing to deploy DING into the known Bust production Supabase project."
            exit 1
          fi
          if [ "${#DING_INVITE_CODE}" -lt 24 ]; then
            echo "::error::DING_INVITE_CODE must be at least 24 characters."
            exit 1
          fi

          vapid_public="$(
            printf '%s' "$VAPID_KEYS_JSON" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                if (typeof value?.publicKey !== "string" || !value.publicKey) process.exit(1);
                process.stdout.write(value.publicKey);
              });
            '
          )"
          vapid_private="$(
            printf '%s' "$VAPID_KEYS_JSON" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                if (typeof value?.privateKey !== "string" || !value.privateKey) process.exit(1);
                process.stdout.write(value.privateKey);
              });
            '
          )"
          cron_secret="$(
            VAPID_PRIVATE_KEY="$vapid_private" node -e '
              const { createHash } = require("crypto");
              process.stdout.write(
                createHash("sha256")
                  .update("ding-cron-v1:" + process.env.VAPID_PRIVATE_KEY)
                  .digest("base64url")
              );
            '
          )"

          echo "::add-mask::$vapid_private"
          echo "::add-mask::$cron_secret"
          echo "VAPID_PUBLIC_KEY=$vapid_public" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$vapid_private" >> "$GITHUB_ENV"
          echo "REMINDER_CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_WEB_PUSH_PUBLIC_KEY=$vapid_public" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Ensure dedicated DING Supabase API keys
        shell: bash
        run: |
          set -euo pipefail

          fetch_keys() {
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          }

          keys_json="$(fetch_keys)"
          has_web="$(
            printf '%s' "$keys_json" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const keys = JSON.parse(raw);
                process.stdout.write(
                  String(Array.isArray(keys) && keys.some(item => item?.type === "publishable" && item?.name === "ding-web"))
                );
              });
            '
          )"
          has_edge="$(
            printf '%s' "$keys_json" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const keys = JSON.parse(raw);
                process.stdout.write(
                  String(Array.isArray(keys) && keys.some(item => item?.type === "secret" && item?.name === "ding-edge"))
                );
              });
            '
          )"

          if [ "$has_web" != "true" ]; then
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"publishable","name":"ding-web","description":"DING browser client"}' \
              >/dev/null
          fi

          if [ "$has_edge" != "true" ]; then
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"secret","name":"ding-edge","description":"DING Edge Functions","secret_jwt_template":{"role":"service_role"}}' \
              >/dev/null
          fi

          keys_json="$(fetch_keys)"
          publishable="$(
            printf '%s' "$keys_json" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const keys = JSON.parse(raw);
                const key = Array.isArray(keys)
                  ? keys.find(item => item?.type === "publishable" && item?.name === "ding-web" && item?.api_key)
                  : null;
                if (!key) {
                  console.error("DING publishable key provisioning failed.");
                  process.exit(1);
                }
                const edge = keys.find(item => item?.type === "secret" && item?.name === "ding-edge");
                if (!edge) {
                  console.error("DING Edge secret key provisioning failed.");
                  process.exit(1);
                }
                if (edge.secret_jwt_template?.role && edge.secret_jwt_template.role !== "service_role") {
                  console.error("Existing ding-edge key does not carry the service_role template.");
                  process.exit(1);
                }
                process.stdout.write(key.api_key);
              });
            '
          )"

          echo "::add-mask::$publishable"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable" >> "$GITHUB_ENV"

      - name: Link dedicated DING Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Lock down public Supabase Auth signup
        shell: bash
        run: |
          set -euo pipefail
          auth_config="$(
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 30 \
              -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"disable_signup":true,"external_anonymous_users_enabled":false}'
          )"
          printf '%s' "$auth_config" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const config = JSON.parse(raw);
              if (config.disable_signup !== true || config.external_anonymous_users_enabled !== false) {
                console.error("Auth lock-down did not persist.");
                process.exit(1);
              }
            });
          '

      - name: Preview remote DING migrations
        run: supabase db push --linked --include-all --dry-run

      - name: Apply DING migrations
        run: supabase db push --linked --include-all --yes

      - name: Configure Edge Function secrets
        shell: bash
        env:
          DING_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          args=(
            "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
            "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            "VAPID_SUBJECT=$VAPID_SUBJECT"
            "REMINDER_CRON_SECRET=$REMINDER_CRON_SECRET"
            "DING_INVITE_CODE=$DING_INVITE_CODE"
            "SITE_URL=$DING_SITE_URL"
          )
          if [ -n "${BROADCAST_ADMINS:-}" ]; then
            args+=("BROADCAST_ADMINS=$BROADCAST_ADMINS")
          fi
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            args+=("DISCORD_WEBHOOK_URL=$DISCORD_WEBHOOK_URL")
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"

      - name: Deploy DING Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Live Supabase integration smoke
        run: npm run test:integration

      - name: Build GitHub Pages artifact
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
